name: Reusable governance guard

on:
  workflow_call:
    inputs:
      additional_high_risk_patterns:
        description: Optional newline-separated glob patterns added to the built-in high-risk defaults.
        required: false
        type: string
        default: ""
      require_manual_marker_for_high_risk:
        required: false
        type: boolean
        default: true
      require_aggregate_gate:
        required: false
        type: boolean
        default: true
      enforce_immutable_action_pins:
        required: false
        type: boolean
        default: true
      enforce_platform_sha_pins:
        required: false
        type: boolean
        default: true
      platform_repository:
        required: false
        type: string
        default: karnalooch/engineering-platform

permissions: {}

jobs:
  governance:
    name: Governance guard
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Classify risk and enforce governance contract
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          ADDITIONAL_HIGH_RISK_PATTERNS: ${{ inputs.additional_high_risk_patterns }}
          REQUIRE_MANUAL_MARKER: ${{ inputs.require_manual_marker_for_high_risk }}
          REQUIRE_AGGREGATE_GATE: ${{ inputs.require_aggregate_gate }}
          ENFORCE_ACTION_PINS: ${{ inputs.enforce_immutable_action_pins }}
          ENFORCE_PLATFORM_PINS: ${{ inputs.enforce_platform_sha_pins }}
          PLATFORM_REPOSITORY: ${{ inputs.platform_repository }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import fnmatch
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          ROOT = Path.cwd()
          WORKFLOW_DIR = ROOT / ".github" / "workflows"

          SHA40 = re.compile(r"^[0-9a-f]{40}$")
          USES = re.compile(r"^\s*uses:\s*([^\s#]+)", re.MULTILINE)
          FAIL_OPEN = re.compile(
              r"^\s*continue-on-error:\s*true\s*(?:#.*)?$",
              re.IGNORECASE | re.MULTILINE,
          )
          AGGREGATE_NAME = re.compile(
              r"""^\s*name:\s*["']?Aggregate CI gate["']?\s*(?:#.*)?$""",
              re.MULTILINE,
          )
          AGGREGATE_ALWAYS = re.compile(
              r"""^\s*if:\s*["']?\$\{\{\s*always\(\)\s*\}\}["']?\s*(?:#.*)?$""",
              re.MULTILINE,
          )

          DEFAULT_HIGH_RISK_PATTERNS = (
              ".github/**",
              "SECURITY.md",
              "**/SECURITY.md",
              "package.json",
              "**/package.json",
              "pnpm-lock.yaml",
              "**/pnpm-lock.yaml",
              "package-lock.json",
              "**/package-lock.json",
              "yarn.lock",
              "**/yarn.lock",
              "pnpm-workspace.yaml",
              "**/pnpm-workspace.yaml",
              "pyproject.toml",
              "**/pyproject.toml",
              "requirements*.txt",
              "**/requirements*.txt",
              "Dockerfile*",
              "**/Dockerfile*",
              "docker-compose*.yml",
              "**/docker-compose*.yml",
              "compose*.yml",
              "**/compose*.yml",
              ".nvmrc",
              ".node-version",
              ".python-version",
              "**/.nvmrc",
              "**/.node-version",
              "**/.python-version",
              "eas.json",
              "**/eas.json",
              "app.config.js",
              "**/app.config.js",
          )

          def as_bool(name: str) -> bool:
              return os.environ.get(name, "").strip().lower() == "true"

          def git(*args: str) -> str:
              result = subprocess.run(
                  ["git", *args],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
              )
              return result.stdout

          def matches_any(path: str, patterns: list[str]) -> bool:
              return any(fnmatch.fnmatch(path, pattern) for pattern in patterns)

          problems: list[str] = []
          notes: list[str] = []
          workflow_files = sorted(
              [*WORKFLOW_DIR.glob("*.yml"), *WORKFLOW_DIR.glob("*.yaml")]
          )

          if not workflow_files:
              problems.append("no GitHub Actions workflow files discovered")

          # 1. Classify pull-request risk from the actual changed paths.
          changed: list[str] = []
          high_risk: list[str] = []

          if os.environ.get("EVENT_NAME") == "pull_request":
              base = os.environ.get("BASE_SHA", "").strip()
              head = os.environ.get("HEAD_SHA", "").strip()

              if not base or not head:
                  problems.append("pull request event is missing base/head SHA")
              else:
                  changed = [
                      line.strip()
                      for line in git("diff", "--name-only", base, head).splitlines()
                      if line.strip()
                  ]

                  patterns = list(DEFAULT_HIGH_RISK_PATTERNS)
                  patterns.extend(
                      line.strip()
                      for line in os.environ.get(
                          "ADDITIONAL_HIGH_RISK_PATTERNS", ""
                      ).splitlines()
                      if line.strip()
                  )

                  high_risk = [
                      path for path in changed if matches_any(path, patterns)
                  ]

                  if high_risk:
                      notes.append(
                          "high-risk paths: " + ", ".join(sorted(high_risk))
                      )

                      if as_bool("REQUIRE_MANUAL_MARKER"):
                          body = os.environ.get("PR_BODY", "")
                          if not re.search(
                              r"(?im)^\s*Auto-merge:\s*manual\s*$",
                              body,
                          ):
                              problems.append(
                                  "high-risk PR must contain exactly "
                                  "'Auto-merge: manual' in the PR body"
                              )
                  else:
                      notes.append("risk classification: normal")

          # 2. Enforce immutable workflow/action refs and fail-closed workflow policy.
          platform_repo = os.environ.get(
              "PLATFORM_REPOSITORY",
              "karnalooch/engineering-platform",
          )

          for path in workflow_files:
              text = path.read_text(encoding="utf-8")

              if FAIL_OPEN.search(text):
                  problems.append(
                      f"{path.relative_to(ROOT)}: "
                      "fail-open continue-on-error is forbidden"
                  )

              for match in USES.finditer(text):
                  target = match.group(1)

                  if target.startswith("./") or target.startswith("docker://"):
                      continue

                  if "@" not in target:
                      problems.append(
                          f"{path.relative_to(ROOT)}: external action/workflow "
                          f"lacks an immutable ref: {target}"
                      )
                      continue

                  owner_path, ref = target.rsplit("@", 1)

                  if (
                      as_bool("ENFORCE_PLATFORM_PINS")
                      and owner_path.startswith(platform_repo + "/")
                      and not SHA40.fullmatch(ref)
                  ):
                      problems.append(
                          f"{path.relative_to(ROOT)}: engineering-platform "
                          f"consumer ref must be a full 40-char SHA: {target}"
                      )

                  if as_bool("ENFORCE_ACTION_PINS") and not SHA40.fullmatch(ref):
                      problems.append(
                          f"{path.relative_to(ROOT)}: external action/workflow "
                          f"must be pinned to a full 40-char SHA: {target}"
                      )

          # 3. Preserve a real caller-local aggregate boundary.
          if as_bool("REQUIRE_AGGREGATE_GATE"):
              aggregate_files: list[tuple[Path, str]] = []

              for workflow_path in workflow_files:
                  workflow_text = workflow_path.read_text(encoding="utf-8")
                  if AGGREGATE_NAME.search(workflow_text):
                      aggregate_files.append((workflow_path, workflow_text))

              if not aggregate_files:
                  problems.append(
                      "required local check 'Aggregate CI gate' was not found"
                  )
              elif not any(
                  AGGREGATE_ALWAYS.search(workflow_text)
                  for _, workflow_text in aggregate_files
              ):
                  problems.append(
                      "the workflow containing 'Aggregate CI gate' must include "
                      "an always() fail-closed path"
                  )

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = ["## Governance guard", ""]
          lines.append(
              f"- changed files: {len(changed)}"
              if os.environ.get("EVENT_NAME") == "pull_request"
              else "- risk classification: skipped outside pull_request"
          )
          lines.append(f"- high-risk files: {len(high_risk)}")
          for note in notes:
              lines.append(f"- {note}")
          lines.append(f"- workflow files checked: {len(workflow_files)}")

          if problems:
              lines.append("- result: **FAIL**")
              if summary:
                  Path(summary).write_text(
                      "\n".join(lines) + "\n",
                      encoding="utf-8",
                  )
              print("governance guard: FAIL", file=sys.stderr)
              for problem in problems:
                  print(f"  - {problem}", file=sys.stderr)
              raise SystemExit(1)

          lines.append("- result: **PASS**")
          if summary:
              Path(summary).write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8",
              )

          print("governance guard: PASS")
          for note in notes:
              print(f"  - {note}")
          PY
