name: Reusable governance guard

on:
  workflow_call:
    inputs:
      additional_high_risk_patterns:
        description: Optional newline-separated glob patterns added to the built-in high-risk defaults.
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  governance:
    name: Governance guard
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Classify risk and enforce governance contract
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          ADDITIONAL_HIGH_RISK_PATTERNS: ${{ inputs.additional_high_risk_patterns }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import fnmatch
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          ROOT = Path.cwd()
          WORKFLOW_DIR = ROOT / ".github" / "workflows"
          PLATFORM_REPOSITORY = "karnalooch/engineering-platform"

          SHA40 = re.compile(r"^[0-9a-f]{40}$")
          USES = re.compile(r"^\s*uses:\s*([^\s#]+)", re.MULTILINE)
          FAIL_OPEN = re.compile(
              r"^\s*continue-on-error:\s*true\s*(?:#.*)?$",
              re.IGNORECASE | re.MULTILINE,
          )
          WRITE_ALL = re.compile(
              r"^\s*permissions:\s*write-all\s*(?:#.*)?$",
              re.IGNORECASE | re.MULTILINE,
          )
          AGGREGATE_NAME = re.compile(
              r"""^\s*name:\s*["']?Aggregate CI gate["']?\s*(?:#.*)?$"""
          )
          AGGREGATE_ALWAYS = re.compile(
              r"""^\s*if:\s*["']?\$\{\{\s*always\(\)\s*\}\}["']?\s*(?:#.*)?$"""
          )

          DEFAULT_HIGH_RISK_PATTERNS = (
              ".github/**",
              "SECURITY.md",
              "**/SECURITY.md",
              "package.json",
              "**/package.json",
              "pnpm-lock.yaml",
              "**/pnpm-lock.yaml",
              "package-lock.json",
              "**/package-lock.json",
              "yarn.lock",
              "**/yarn.lock",
              "pnpm-workspace.yaml",
              "**/pnpm-workspace.yaml",
              "pyproject.toml",
              "**/pyproject.toml",
              "requirements*.txt",
              "**/requirements*.txt",
              "Dockerfile*",
              "**/Dockerfile*",
              "docker-compose*.yml",
              "**/docker-compose*.yml",
              "compose*.yml",
              "**/compose*.yml",
              ".nvmrc",
              ".node-version",
              ".python-version",
              "**/.nvmrc",
              "**/.node-version",
              "**/.python-version",
              "eas.json",
              "**/eas.json",
              "app.config.js",
              "**/app.config.js",
          )

          def git(*args: str) -> str:
              result = subprocess.run(
                  ["git", *args],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
              )
              return result.stdout

          def matches_any(path: str, patterns: list[str]) -> bool:
              return any(fnmatch.fnmatch(path, pattern) for pattern in patterns)

          def leading_spaces(line: str) -> int:
              return len(line) - len(line.lstrip(" "))

          def has_fail_closed_aggregate(text: str) -> tuple[bool, bool]:
              lines = text.splitlines()
              found_name = False

              for index, line in enumerate(lines):
                  if leading_spaces(line) != 4 or not AGGREGATE_NAME.fullmatch(line):
                      continue

                  found_name = True
                  # GitHub workflow structure is top-level jobs -> job id (2 spaces)
                  # -> job properties (4 spaces). Find the complete job block so an
                  # unrelated always() elsewhere cannot satisfy this contract.
                  start = index
                  while start > 0:
                      candidate = lines[start - 1]
                      if candidate.strip() and leading_spaces(candidate) < 4:
                          break
                      start -= 1

                  end = index + 1
                  while end < len(lines):
                      candidate = lines[end]
                      if candidate.strip() and leading_spaces(candidate) < 4:
                          break
                      end += 1

                  if any(
                      leading_spaces(candidate) == 4
                      and AGGREGATE_ALWAYS.fullmatch(candidate)
                      for candidate in lines[start:end]
                  ):
                      return True, True

              return found_name, False

          problems: list[str] = []
          notes: list[str] = []
          workflow_files = sorted(
              [*WORKFLOW_DIR.glob("*.yml"), *WORKFLOW_DIR.glob("*.yaml")]
          )

          if not workflow_files:
              problems.append("no GitHub Actions workflow files discovered")

          # 1. Classify pull-request risk from the actual changed paths.
          changed: list[str] = []
          high_risk: list[str] = []

          if os.environ.get("EVENT_NAME") == "pull_request":
              base = os.environ.get("BASE_SHA", "").strip()
              head = os.environ.get("HEAD_SHA", "").strip()

              if not base or not head:
                  problems.append("pull request event is missing base/head SHA")
              else:
                  changed = [
                      line.strip()
                      for line in git("diff", "--name-only", base, head).splitlines()
                      if line.strip()
                  ]

                  patterns = list(DEFAULT_HIGH_RISK_PATTERNS)
                  patterns.extend(
                      line.strip()
                      for line in os.environ.get(
                          "ADDITIONAL_HIGH_RISK_PATTERNS", ""
                      ).splitlines()
                      if line.strip()
                  )

                  high_risk = [
                      path for path in changed if matches_any(path, patterns)
                  ]

                  if high_risk:
                      notes.append(
                          "high-risk paths: " + ", ".join(sorted(high_risk))
                      )
                      body = os.environ.get("PR_BODY", "")
                      if not re.search(
                          r"(?im)^\s*Auto-merge:\s*manual\s*$",
                          body,
                      ):
                          problems.append(
                              "high-risk PR must contain exactly "
                              "'Auto-merge: manual' in the PR body"
                          )
                  else:
                      notes.append("risk classification: normal")

          # 2. Enforce immutable refs and fail-closed workflow policy.
          for path in workflow_files:
              text = path.read_text(encoding="utf-8")

              if FAIL_OPEN.search(text):
                  problems.append(
                      f"{path.relative_to(ROOT)}: "
                      "fail-open continue-on-error is forbidden"
                  )

              if WRITE_ALL.search(text):
                  problems.append(
                      f"{path.relative_to(ROOT)}: permissions: write-all is forbidden"
                  )

              for match in USES.finditer(text):
                  target = match.group(1)

                  if target.startswith("./") or target.startswith("docker://"):
                      continue

                  if "@" not in target:
                      problems.append(
                          f"{path.relative_to(ROOT)}: external action/workflow "
                          f"lacks an immutable ref: {target}"
                      )
                      continue

                  owner_path, ref = target.rsplit("@", 1)

                  if (
                      owner_path.startswith(PLATFORM_REPOSITORY + "/")
                      and not SHA40.fullmatch(ref)
                  ):
                      problems.append(
                          f"{path.relative_to(ROOT)}: engineering-platform "
                          f"consumer ref must be a full 40-char SHA: {target}"
                      )

                  if not SHA40.fullmatch(ref):
                      problems.append(
                          f"{path.relative_to(ROOT)}: external action/workflow "
                          f"must be pinned to a full 40-char SHA: {target}"
                      )

          # 3. Preserve a real caller-local aggregate boundary.
          aggregate_name_found = False
          aggregate_fail_closed = False

          for workflow_path in workflow_files:
              found_name, fail_closed = has_fail_closed_aggregate(
                  workflow_path.read_text(encoding="utf-8")
              )
              aggregate_name_found = aggregate_name_found or found_name
              aggregate_fail_closed = aggregate_fail_closed or fail_closed

          if not aggregate_name_found:
              problems.append(
                  "required local check 'Aggregate CI gate' was not found "
                  "as a job name"
              )
          elif not aggregate_fail_closed:
              problems.append(
                  "the Aggregate CI gate job must include "
                  "a job-level always() condition at aggregate job-property indentation"
              )

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = ["## Governance guard", ""]
          lines.append(
              f"- changed files: {len(changed)}"
              if os.environ.get("EVENT_NAME") == "pull_request"
              else "- risk classification: skipped outside pull_request"
          )
          lines.append(f"- high-risk files: {len(high_risk)}")
          for note in notes:
              lines.append(f"- {note}")
          lines.append(f"- workflow files checked: {len(workflow_files)}")

          if problems:
              lines.append("- result: **FAIL**")
              if summary:
                  Path(summary).write_text(
                      "\n".join(lines) + "\n",
                      encoding="utf-8",
                  )
              print("governance guard: FAIL", file=sys.stderr)
              for problem in problems:
                  print(f"  - {problem}", file=sys.stderr)
              raise SystemExit(1)

          lines.append("- result: **PASS**")
          if summary:
              Path(summary).write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8",
              )

          print("governance guard: PASS")
          for note in notes:
              print(f"  - {note}")
          PY
