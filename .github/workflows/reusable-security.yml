name: Reusable security baseline

on:
  workflow_call:
    inputs:
      enable_dependency_review:
        required: false
        type: boolean
        default: true
      enable_codeql:
        required: false
        type: boolean
        default: true
      codeql_languages_json:
        description: JSON array accepted by the CodeQL language matrix.
        required: false
        type: string
        default: '["python"]'
      enable_trivy:
        required: false
        type: boolean
        default: true
      enable_sbom:
        required: false
        type: boolean
        default: true
      enable_docs_only_light_lane:
        description: Skip heavyweight security jobs for trusted docs-only pull requests while retaining a successful security contract.
        required: false
        type: boolean
        default: false
      dependency_fail_severity:
        required: false
        type: string
        default: high
      deny_licenses:
        required: false
        type: string
        default: "AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later"
      trivy_scanners:
        required: false
        type: string
        default: "vuln,secret,misconfig"
      trivy_severity:
        required: false
        type: string
        default: "HIGH,CRITICAL"

permissions: {}

jobs:
  plan:
    name: Security cost plan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      run_heavy: ${{ steps.plan.outputs.run_heavy }}
      classification: ${{ steps.plan.outputs.classification }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - name: Checkout caller history for docs-only classification
        if: ${{ inputs.enable_docs_only_light_lane && github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Plan heavyweight security evidence
        id: plan
        shell: bash
        env:
          LIGHT_LANE_ENABLED: ${{ inputs.enable_docs_only_light_lane }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          run_heavy=true
          classification=full
          reason="full security baseline"

          if [[ "${LIGHT_LANE_ENABLED}" == "true" && "${EVENT_NAME}" == "pull_request" ]]; then
            if [[ -z "${BASE_SHA}" || -z "${HEAD_SHA}" ]]; then
              reason="missing pull-request SHAs; failed safe to full"
            elif ! changed_paths="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"; then
              reason="changed-path discovery failed; failed safe to full"
            elif [[ -z "${changed_paths}" ]]; then
              reason="empty change set; failed safe to full"
            else
              docs_only=true

              while IFS= read -r path; do
                [[ -z "${path}" ]] && continue

                case "${path}" in
                  .github/*|scripts/ci/*|SECURITY.md|*/SECURITY.md)
                    docs_only=false
                    break
                    ;;
                  docs/*|README.md|CHANGELOG.md|*.md)
                    ;;
                  *)
                    docs_only=false
                    break
                    ;;
                esac
              done <<< "${changed_paths}"

              if [[ "${docs_only}" == "true" ]]; then
                run_heavy=false
                classification=docs-only
                reason="documentation-only pull request"
              else
                reason="non-documentation, mixed, CI-core, or security-policy change"
              fi
            fi
          elif [[ "${LIGHT_LANE_ENABLED}" != "true" ]]; then
            reason="docs-only light lane not enabled by caller"
          else
            reason="non-pull-request event always requires full security"
          fi

          echo "run_heavy=${run_heavy}" >> "${GITHUB_OUTPUT}"
          echo "classification=${classification}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"

          printf 'security plan: classification=%s run_heavy=%s reason=%s\n' \
            "${classification}" "${run_heavy}" "${reason}"

  dependency-review:
    name: Dependency review
    needs: plan
    if: ${{ inputs.enable_dependency_review && github.event_name == 'pull_request' && needs.plan.outputs.run_heavy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Block vulnerable or incompatible new dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.dependency_fail_severity }}
          license-check: true
          vulnerability-check: true
          deny-licenses: ${{ inputs.deny_licenses }}

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: plan
    if: ${{ inputs.enable_codeql && needs.plan.outputs.run_heavy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.codeql_languages_json) }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:${{ matrix.language }}

  trivy:
    name: Trivy filesystem
    needs: plan
    if: ${{ inputs.enable_trivy && needs.plan.outputs.run_heavy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan vulnerabilities, secrets and misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: ${{ inputs.trivy_scanners }}
          severity: ${{ inputs.trivy_severity }}
          ignore-unfixed: false
          exit-code: '1'
          format: table

  sbom:
    name: Source SBOM
    needs: plan
    if: ${{ inputs.enable_sbom && github.event_name != 'pull_request' && needs.plan.outputs.run_heavy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json

      - name: Preserve SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 14
          if-no-files-found: error
