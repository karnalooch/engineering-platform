name: Gumball CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: gumball-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: CI cost plan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      classification: ${{ steps.plan.outputs.classification }}
      security_required: ${{ steps.plan.outputs.security_required }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plan exact validation surface
        id: plan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/plan_gumball_ci.py \
            --event-name "${GITHUB_EVENT_NAME}" \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}" >> "${GITHUB_OUTPUT}"

  repo-policy:
    name: Repository policy
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-repo-policy.yml

  governance:
    name: Governance policy
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-governance.yml
    with:
      additional_high_risk_patterns: |
        scripts/**
        AGENTS.md
        gumball.yaml
        profiles/**
        .gumball/**
        .gitattributes
        .gitmodules
        LICENSE
        LICENSE.md
        LICENSE.txt
        VERSION
        CHANGELOG.md
        docs/AGGREGATE_GATE.md
        docs/CONTRACT.md
        docs/GOVERNANCE_GUARD.md
        docs/ROLLOUT.md
        docs/VERSIONING.md
        docs/AUTO_MERGE.md
        docs/README.md
        docs/ARCHITECTURE.md
        docs/DOGFOODING.md
        docs/DIAGRAM_STYLE.md
        docs/ADOPTION.md
        docs/CI_MODEL.md
        docs/UPSTREAM_PROMOTION.md
        docs/ONE_PROMPT_BOOTSTRAP.md
        docs/MCP_AND_TOOLS.md
        docs/REPOSITORY_LIFECYCLE.md
        docs/PROJECTS_FLOW.md
        docs/RELEASE_LINEAGE.md
        docs/LABELS.md
        docs/CI_COST_GOVERNOR.md
        docs/PROOF_BROKER.md
        .gumball/repository-os.json
        .gumball/proof-broker.json
        scripts/ops/**
        templates/release-manifest.json
        .github/workflows/repository-ops.yml
        .github/workflows/proof-broker.yml

  workflow-contract:
    name: Workflow contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Validate reusable workflow contract
        run: python scripts/ci/validate_platform.py

      - name: Validate Gumball bootstrap and feedback contracts
        run: |
          python scripts/gumball.py doctor
          python scripts/gumball.py promote
          python scripts/ci/check_docs_index.py
          python -m unittest scripts/ci/test_gumball.py -v
          python -m unittest scripts/ci/test_repository_os.py -v
          python -m unittest scripts/ci/test_github_ops.py -v
          python -m unittest scripts/ci/test_proof_broker.py -v
          python scripts/ops/repository_os.py --help
          python scripts/ops/github_ops.py --help
          python scripts/ops/proof_broker.py validate
          python scripts/ops/proof_broker.py --help
          python -m unittest scripts/ci/test_ci_primitives.py -v

      - name: Test fail-closed governance and auto-merge policy
        run: |
          python -m unittest scripts/ci/test_governance_workflow.py -v
          python -m unittest scripts/ci/test_auto_merge.py -v
          python -m unittest scripts/ci/test_auto_merge_workflow.py -v

  security:
    name: Security baseline
    needs: plan
    if: ${{ needs.plan.outputs.security_required == 'true' }}
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-security.yml
    with:
      codeql_languages_json: '["python"]'

  aggregate:
    name: Aggregate CI gate
    if: ${{ always() }}
    needs:
      - plan
      - repo-policy
      - governance
      - workflow-contract
      - security
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Fail closed against the planned proof set
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CLASSIFICATION: ${{ needs.plan.outputs.classification }}
          SECURITY_REQUIRED: ${{ needs.plan.outputs.security_required }}
          REPO_POLICY_RESULT: ${{ needs.repo-policy.result }}
          GOVERNANCE_RESULT: ${{ needs.governance.result }}
          WORKFLOW_CONTRACT_RESULT: ${{ needs.workflow-contract.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          set -euo pipefail
          failed=0

          for entry in \
            "plan=${PLAN_RESULT}" \
            "repo-policy=${REPO_POLICY_RESULT}" \
            "governance=${GOVERNANCE_RESULT}" \
            "workflow-contract=${WORKFLOW_CONTRACT_RESULT}"
          do
            name="${entry%%=*}"
            result="${entry#*=}"
            if [ "${result}" != "success" ]; then
              echo "::error::${name}: expected success, got ${result}"
              failed=1
            fi
          done

          case "${SECURITY_REQUIRED}" in
            true)
              if [ "${SECURITY_RESULT}" != "success" ]; then
                echo "::error::security: required by ${CLASSIFICATION} plan, got ${SECURITY_RESULT}"
                failed=1
              fi
              ;;
            false)
              if [ "${SECURITY_RESULT}" != "skipped" ]; then
                echo "::error::security: docs-only plan expected skipped, got ${SECURITY_RESULT}"
                failed=1
              fi
              ;;
            *)
              echo "::error::planner: invalid security_required='${SECURITY_REQUIRED}'"
              failed=1
              ;;
          esac

          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi
          echo "aggregate: PASS classification=${CLASSIFICATION} security_required=${SECURITY_REQUIRED}"
