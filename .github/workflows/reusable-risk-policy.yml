name: Reusable PR risk policy

on:
  workflow_call:
    inputs:
      high_risk_globs:
        description: Comma-separated fnmatch patterns that force high risk.
        required: false
        type: string
        default: ".github/**,SECURITY.md,Dockerfile*,**/Dockerfile*,docker-compose*.yml,docker-compose*.yaml,package.json,**/package.json,pyproject.toml,**/pyproject.toml,requirements*.txt,**/requirements*.txt,pnpm-lock.yaml,**/pnpm-lock.yaml,package-lock.json,**/package-lock.json,yarn.lock,**/yarn.lock"
      require_explicit_high_risk:
        description: Require the PR body to declare Risk: high when high-risk files changed.
        required: false
        type: boolean
        default: true
    outputs:
      risk_level:
        description: Computed PR risk level.
        value: ${{ jobs.risk-policy.outputs.risk_level }}

permissions: {}

jobs:
  risk-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      risk_level: ${{ steps.classify.outputs.risk_level }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed paths and enforce merge policy
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HIGH_RISK_GLOBS: ${{ inputs.high_risk_globs }}
          REQUIRE_EXPLICIT_HIGH_RISK: ${{ inputs.require_explicit_high_risk }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import fnmatch
          import os
          import re
          import subprocess
          import sys

          event_name = os.environ.get("EVENT_NAME", "")
          if event_name != "pull_request":
              print("risk policy: non-PR event; risk=none")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write("risk_level=none\n")
              raise SystemExit(0)

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          body = os.environ.get("PR_BODY", "") or ""
          patterns = [
              item.strip()
              for item in os.environ["HIGH_RISK_GLOBS"].split(",")
              if item.strip()
          ]

          changed = subprocess.run(
              ["git", "diff", "--name-only", base, head],
              check=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          ).stdout.splitlines()

          high_risk_files = [
              path
              for path in changed
              if any(fnmatch.fnmatch(path, pattern) for pattern in patterns)
          ]
          risk = "high" if high_risk_files else "normal"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"risk_level={risk}\n")

          print(f"risk policy: {risk}")
          if high_risk_files:
              print("high-risk paths:")
              for path in high_risk_files:
                  print(f"  - {path}")

          problems: list[str] = []
          normalized = body.lower()

          if high_risk_files:
              if re.search(r"(?im)^\s*auto-merge:\s*eligible\s*$", body):
                  problems.append(
                      "high-risk changes cannot declare Auto-merge: eligible"
                  )
              if re.search(r"(?im)^\s*risk:\s*(low|medium|normal)\s*$", body):
                  problems.append(
                      "PR understates risk; changed paths require Risk: high"
                  )

              explicit_required = (
                  os.environ["REQUIRE_EXPLICIT_HIGH_RISK"].lower() == "true"
              )
              if explicit_required and not re.search(
                  r"(?im)^\s*risk:\s*high\s*$", body
              ):
                  problems.append(
                      "high-risk changes require an explicit 'Risk: high' line"
                  )

              if not re.search(r"(?im)^\s*auto-merge:\s*manual\s*$", body):
                  problems.append(
                      "high-risk changes require an explicit 'Auto-merge: manual' line"
                  )

          if problems:
              print("risk policy: FAIL", file=sys.stderr)
              for problem in problems:
                  print(f"  - {problem}", file=sys.stderr)
              raise SystemExit(1)

          print("risk policy: PASS")
          PY
