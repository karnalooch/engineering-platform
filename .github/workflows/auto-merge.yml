name: Fail-closed auto merge

on:
  pull_request_target:
    types: [ready_for_review, reopened, synchronize, edited]
  workflow_run:
    workflows: ["Engineering Platform CI"]
    types: [completed]
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

concurrency:
  group: fail-closed-auto-merge-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

jobs:
  evaluate:
    name: Evaluate safe auto merge
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Evaluate eligible pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python scripts/ci/auto_merge.py
